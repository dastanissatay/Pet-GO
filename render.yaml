# Render Blueprint: Postgres + FastAPI backend + static frontend.
# Create it in the Render dashboard: New > Blueprint > pick this repo.
#
# The frontend calls the backend's public URL directly, and the backend allows the
# frontend's URL through CORS. If Render gives a service a different URL than the
# ones below (it adds a suffix when a name is taken), update VITE_API_URL and
# CORS_ORIGINS to the real URLs and redeploy both services.

databases:
  - name: petgo-db
    plan: free # expires 30 days after creation; fine for the hackathon
    region: frankfurt
    databaseName: petgo
    user: petgo
    postgresMajorVersion: "16"

services:
  - type: web
    name: petgo-business-cup-api
    runtime: docker
    plan: free # sleeps after 15 min idle, ~1 min to wake; Starter avoids that
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # The image's own start script (backend/scripts/start.sh) binds to $PORT.
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: prod
      # Free instances have no pre-deploy step, so the start script applies
      # migrations first. alembic upgrade is a no-op when nothing is pending.
      - key: RUN_MIGRATIONS
        value: "true"
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: petgo-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://petgo-business-cup.onrender.com
      - key: WEB_CONCURRENCY
        value: "2"
      - key: LLM_MODEL
        value: claude-haiku-5-5
      # Entered in the dashboard, never committed. The decoder works without it
      # (regex fallback and templated explanations).
      - key: LLM_API_KEY
        sync: false

  - type: web
    name: petgo-business-cup
    runtime: static
    buildCommand: >-
      cd frontend && npx --yes pnpm@10.28.0 install --frozen-lockfile
      && npx --yes pnpm@10.28.0 build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: VITE_API_URL
        value: https://petgo-business-cup-api.onrender.com/api
    routes:
      # Client-side routing: every path that is not a real file gets index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
