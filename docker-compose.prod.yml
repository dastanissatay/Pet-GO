# Prod overrides: built images only, no source mounts, database port closed.
# Migrations are an explicit step after deploy (make migrate), never on container start.
services:
  db:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

  backend:
    restart: unless-stopped
    build:
      context: ./backend
      target: runtime
    environment:
      ENV: prod
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-petgo}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-petgo}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      target: runtime
    ports:
      - "${HTTP_PORT:-80}:80"
