# Base stack. Always combine with docker-compose.dev.yml or docker-compose.prod.yml
# (see the Makefile). Values come from .env; the defaults here are for local dev only.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-petgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petgo}
      POSTGRES_DB: ${POSTGRES_DB:-petgo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      ENV: ${ENV:-dev}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-petgo}:${POSTGRES_PASSWORD:-petgo}@db:5432/${POSTGRES_DB:-petgo}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-haiku-5-5}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
